name: CI

on:
  push:
  pull_request:
  # Aby šel běh spustit ručně z UI - po zapnutí Actions se zpětně nic nespustí.
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.4.*', '8.1.*']
        dependencies: ['highest']
        include:
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: 'lowest'
        exclude:
          # Symfony 8 requires PHP 8.4.
          - php: '8.2'
            symfony: '8.1.*'
          - php: '8.3'
            symfony: '8.1.*'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap
          coverage: none

      - name: Pin the Symfony version
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      - name: Install dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: |
          composer validate --strict
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-progress --no-interaction
          else
            composer update --no-progress --no-interaction
          fi

      - name: Tests
        run: vendor/bin/phpunit
